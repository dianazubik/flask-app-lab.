
{% extends "base.html" %}

{% block title %}Видалення допису{% endblock %}

{% block content %}
<div class="container posts-page">

    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="post-delete">

                <h2 class="mb-3">Підтвердження видалення</h2>

                <p>Ви дійсно хочете видалити цей допис?</p>

                <h5 class="mb-3">{{ post.title }}</h5>

                <p class="text-muted">
                    {{ post.content[:200] }}
                </p>

                <form method="POST">
                    <input type="hidden"
                           name="csrf_token"
                           value="{{ csrf_token() }}">

                    <button type="submit" class="btn btn-danger">
                        Так, видалити
                    </button>

                    <a href="{{ url_for('posts.detail_post', post_id=post.id) }}"
                       class="btn btn-secondary">
                        Скасувати
                    </a>
                </form>

            </div>

        </div>
    </div>

</div>
{% endblock %}
