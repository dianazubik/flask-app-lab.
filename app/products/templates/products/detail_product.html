{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="h3">{{ product.name }}</h1>
        <p class="fw-bold">Ціна: ${{ product.price }}</p>
        <p>{{ product.content }}</p>
        <a href="{{ url_for('products.product_list') }}" class="btn btn-secondary btn-sm">← До списку товарів</a>
    </div>
</div>
{% endblock %}
